<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Experiencia 02 - Componentes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-5">

    <!-- Clase de tarjeta -->
    <div class="card shadow-lg">

        <!-- Imagen Estilizada -->
        <div class="text-center pt-4 pb-2 bg-primary">
            <img src="https://placehold.co/100x100" alt="Perfil" class="rounded-circle border border-3 border-white"
                width="100" height="100">
        </div>

        <!-- Clases card-body y text-center -->
        <div class="card-body text-center">
            <h3 class="card-title mb-1">Juan Pérez</h3>
            <p class="text-muted mb-3">Ingeniero de Software</p>

            <!-- Convertido en list-group -->
            <ul class="list-group list-group-flush text-start mb-3">
                <li class="list-group-item">React & Angular</li>
                <li class="list-group-item">Python (Reflex)</li>
                <li class="list-group-item">Bases de Datos</li>
            </ul>

            <!-- Convertido en boton -->
            <a href="#" class="btn btn-primary w-100">Contactar</a>
        </div>
    </div>

</body>

</html>
